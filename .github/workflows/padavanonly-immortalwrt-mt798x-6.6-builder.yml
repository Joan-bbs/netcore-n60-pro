name: padavanonly-immortalwrt-mt798x-6.6-builder

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: padavanonly-immortalwrt-mt798x-6.6.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part5-6.6.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FIRMWARE_TAG: padavanonly-237-mt798x-6.6
  TZ: Asia/Shanghai
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ" || true
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Prepare custom feeds
      run: |
        cd openwrt
        sed -i '1i src-git smpackage https://github.com/kenzok8/small-package' feeds.conf.default
        ./scripts/feeds update -a
        rm -rf feeds/luci/applications/{luci-app-dae,luci-app-daed,luci-app-mosdns}
        rm -rf feeds/packages/net/{alist,adguardhome,dae,daed,mosdns,xray*,v2ray*,sing*,smartdns} feeds/packages/utils/v2dat feeds/packages/lang/golang
        rm -rf feeds/smpackage/{base-files,dae,daed,dnsmasq,firewall*,fullconenat,libnftnl,luci-app-dae,luci-app-daed,luci-app-daede,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}
        git clone https://github.com/kenzok8/golang -b 1.26 feeds/packages/lang/golang
        git clone --depth=1 --filter=blob:none --sparse https://github.com/kenzok8/openwrt-daede package/community/openwrt-daede
        git -C package/community/openwrt-daede sparse-checkout set daed luci-app-daede vmlinux-btf
        test -f package/community/openwrt-daede/daed/Makefile
        test -f package/community/openwrt-daede/luci-app-daede/Makefile
        sed -i '/^define Package\/.*\/config$/,/^endef$/d' package/community/openwrt-daede/luci-app-daede/Makefile
        sed -i 's|DEPENDS:=.*|DEPENDS:=+luci-base +daed|' package/community/openwrt-daede/luci-app-daede/Makefile
        sed -i 's|managing dae or daed backends|managing the daed backend|' package/community/openwrt-daede/luci-app-daede/Makefile
        sed -i '\|../dae/files/dae.config|d' package/community/openwrt-daede/luci-app-daede/Makefile
        ! grep -Eq 'PACKAGE_\$\(PKG_NAME\)_dae|\.\./dae/files/dae\.config' package/community/openwrt-daede/luci-app-daede/Makefile
        ./scripts/feeds update -i packages luci smpackage

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        test -s "$CONFIG_FILE"
        cp "$CONFIG_FILE" openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Restore compiler cache
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: /workdir/openwrt/.ccache
        key: ${{ runner.os }}-ubuntu22-mt798x66-ccache-v1-${{ hashFiles('padavanonly-immortalwrt-mt798x-6.6.config', 'diy-part1.sh', 'diy-part5-6.6.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ runner.os }}-ubuntu22-mt798x66-ccache-v1-${{ hashFiles('padavanonly-immortalwrt-mt798x-6.6.config', 'diy-part1.sh', 'diy-part5-6.6.sh') }}-

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        mkdir -p "$GITHUB_WORKSPACE/build-records"
        cp .config "$GITHUB_WORKSPACE/build-records/final.config"
        grep -qx 'CONFIG_CCACHE=y' .config || {
          echo "::error title=Compiler cache disabled::CONFIG_CCACHE was dropped by make defconfig"
          exit 1
        }
        # Validate requested removals without changing the generated config.
        if grep -Eq '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-quickstart|quickstart)=[ym]$' .config; then
          echo "::error::A removed package was re-enabled by dependency resolution"
          exit 1
        fi
        grep -qx 'CONFIG_PACKAGE_daed=y' .config
        grep -qx 'CONFIG_PACKAGE_luci-app-daede=y' .config
        ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/build-records/diffconfig.txt"
        {
          printf 'Workflow commit: %s\n' "$GITHUB_SHA"
          printf 'Firmware source: %s %s\n' "$REPO_URL" "$REPO_BRANCH"
          git rev-parse HEAD
          for source_dir in feeds/* package/community/openwrt-daede feeds/packages/lang/golang; do
            if [ -d "$source_dir/.git" ] || [ -f "$source_dir/.git" ]; then
              printf '\n%s\n' "$source_dir"
              git -C "$source_dir" rev-parse HEAD
            fi
          done
        } > "$GITHUB_WORKSPACE/build-records/source-revisions.txt"
        cp feeds.conf.default "$GITHUB_WORKSPACE/build-records/feeds.conf.default"
        set -o pipefail
        make download -j8 2>&1 | tee "$GITHUB_WORKSPACE/build-records/download.log" || \
          make download -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build-records/download.log"

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        mkdir -p "$GITHUB_WORKSPACE/build-records"
        set -o pipefail
        make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/build-records/compile.log" || \
          make -j1 V=s 2>&1 | tee -a "$GITHUB_WORKSPACE/build-records/compile.log"
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: success() && steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      run: |
        shopt -s nullglob
        target_dirs=(openwrt/bin/targets/*/*)
        if [ "${#target_dirs[@]}" -ne 1 ]; then
          echo "::error::Expected exactly one firmware target directory"
          exit 1
        fi
        cd "${target_dirs[0]}"
        rm -rf packages
        images=(*.bin *.itb *.img *.img.gz *.img.zst)
        if [ "${#images[@]}" -eq 0 ]; then
          echo "::error::No firmware image was produced"
          exit 1
        fi
        cp -f ./*.manifest "$GITHUB_WORKSPACE/build-records/" 2>/dev/null || true
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: success() && steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: success() && env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${FIRMWARE_TAG}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
        {
          printf 'Firmware built from workflow commit `%s`.\n\n' "$GITHUB_SHA"
          printf 'Build logs, final configuration and source revisions are in the Actions build-records artifact.\n'
        } > release.txt
        echo "status=success" >> "$GITHUB_OUTPUT"

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@master
      if: success() && steps.compile.outputs.status == 'success' && steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        fail_on_unmatched_files: true
        files: ${{ env.FIRMWARE }}/*

    - name: Upload build records
      if: always()
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: build-records-${{ github.run_id }}-${{ github.run_attempt }}
        path: build-records/
        if-no-files-found: ignore
        retention-days: 30

    - name: Delete workflow runs
      if: success() && steps.compile.outputs.status == 'success'
      continue-on-error: true
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 30
        keep_minimum_runs: 10

    - name: Remove old Releases
      continue-on-error: true
      uses: dev-drprasad/delete-older-releases@master
      if: success() && steps.release.outcome == 'success'
      with:
        keep_latest: 6
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
